name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake
      # CMAKE_BUILD_TYPE is used by single-config generators (Linux, macOS);
      # Visual Studio on Windows takes the configuration at build time instead.
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: Install
      shell: bash
      run: |
        cmake --install build --config Release --prefix install
        ./install/bin/dcl --version

  sanitizers:
    name: ${{ matrix.build_type }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, build_type: ASAN }
          - { os: ubuntu-latest, build_type: UBSAN }
          # The only job that exercises the MSVC sanitizer flags.
          - { os: windows-latest, build_type: ASAN }
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Put the MSVC ASan runtime on PATH
      # dcl links against clang_rt.asan_dynamic-*.dll, which lives next to
      # cl.exe and isn't on PATH by default.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
        "$vs\VC\Tools\MSVC\$ver\bin\Hostx64\x64" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
